<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>设置 - 3D文物展示系统</title>
        <link rel="icon" type="image/png" href="../images/favicon.png">
        <link rel="stylesheet" href="../styles/styles.css">
    </head>
    <body class="settings-page" style="width: 100%; height: 100%; overflow: auto; margin: 0;">
        <!-- 顶部导航 -->
        <nav class="museum-nav">
            <div class="nav-container">
                <div class="nav-left">
                    <div class="nav-title">
                        <span class="title-icon">🏛️</span>
                        <span>3D数字文物展馆</span>
                    </div>
                </div>
                <div class="nav-right">
                    <button id="galleryBtn" class="nav-btn">文物列表</button>
                    <button id="tutorialBtn" class="nav-btn">使用教程</button>
                    <button id="settingsBtn" class="nav-btn">返回首页</button>
                    <button id="themeToggleBtn" class="theme-toggle-btn" title="切换日间/夜间模式">🌙 夜间模式</button>
                </div>
            </div>
        </nav>
        
        <div class="welcome-screen" style="justify-content: flex-start; overflow-y: auto; height: auto; min-height: 100vh; padding-top: 120px; padding-bottom: 50px;">
            <div class="welcome-title">系统设置</div>
              <div class="welcome-content" style="max-width: 900px; width: 100%;">
                <!-- 缩放灵敏度设置 -->
                <div class="setting-item">
                    <div class="setting-title">👋 手势灵敏度设置</div>
                    <div class="setting-description">调整手势操作的灵敏度参数，以适应您的操作习惯。</div>
                    
                    <div class="slider-container">
                        <label for="scaleSlider">缩放灵敏度</label>
                        <div class="slider-row">
                            <input type="range" min="0.1" max="6.0" step="0.1" class="slider" id="scaleSlider">
                            <span class="slider-value" id="scaleValue">1.5</span>
                            <button class="save-btn" id="saveScaleBtn">保存</button>
                        </div>
                        <div class="setting-description">
                            调整缩放响应程度（较高值使小幅度捏合或滚轮产生更大缩放效果）
                        </div>
                        <div id="scaleMessage" class="save-message">缩放灵敏度设置已保存！</div>
                    </div>

                    <div class="slider-container">
                        <label for="rotateSlider">旋转灵敏度</label>
                        <div class="slider-row">
                            <input type="range" min="0.005" max="0.05" step="0.001" class="slider" id="rotateSlider">
                            <span class="slider-value" id="rotateValue">0.02</span>
                            <button class="save-btn" id="saveRotateBtn">保存</button>
                        </div>
                        <div class="setting-description">
                            控制旋转响应灵敏度（较高值使小角度旋转产生更大旋转效果）
                        </div>
                        <div id="rotateMessage" class="save-message">旋转灵敏度设置已保存！</div>
                    </div>
                </div>

                <!-- 鼠标灵敏度设置 -->
                <div class="setting-item">
                    <div class="setting-title">🖱️ 鼠标灵敏度设置</div>
                    <div class="setting-description">调整鼠标拖拽平移和滚轮缩放的灵敏度参数。</div>

                    <div class="slider-container">
                        <label for="mouseDragSlider">鼠标拖拽灵敏度</label>
                        <div class="slider-row">
                            <input type="range" min="0.1" max="3.0" step="0.1" class="slider" id="mouseDragSlider">
                            <span class="slider-value" id="mouseDragValue">1.0</span>
                            <button class="save-btn" id="saveMouseDragBtn">保存</button>
                        </div>
                        <div class="setting-description">
                            控制鼠标拖拽平移文物的速度（较高值使鼠标移动产生更大的平移效果）
                        </div>
                        <div id="mouseDragMessage" class="save-message">鼠标拖拽灵敏度设置已保存！</div>
                    </div>

                    <div class="slider-container">
                        <label for="mouseWheelSlider">滚轮缩放灵敏度</label>
                        <div class="slider-row">
                            <input type="range" min="0.1" max="30" step="0.1" class="slider" id="mouseWheelSlider">
                            <span class="slider-value" id="mouseWheelValue">10</span>
                            <button class="save-btn" id="saveMouseWheelBtn">保存</button>
                        </div>
                        <div class="setting-description">
                            控制鼠标滚轮缩放文物的速度（较高值使滚轮滚动产生更大的缩放效果）
                        </div>
                        <div id="mouseWheelMessage" class="save-message">滚轮缩放灵敏度设置已保存！</div>
                    </div>
                </div>
            </div>
        </div>        <script>
            // 加载已保存的设置
            document.addEventListener('DOMContentLoaded', function() {
                // 加载缩放灵敏度设置
                const scaleSlider = document.getElementById('scaleSlider');
                const scaleValue = document.getElementById('scaleValue');
                const saveScaleBtn = document.getElementById('saveScaleBtn');
                const scaleMessage = document.getElementById('scaleMessage');
                
                // 默认缩放灵敏度为1.0，除非有保存的设置
                const savedScaleSensitivity = localStorage.getItem('scaleSensitivity');
                if (savedScaleSensitivity) {
                    scaleSlider.value = savedScaleSensitivity;
                    scaleValue.textContent = savedScaleSensitivity;
                } else {
                    scaleSlider.value = 1.5; // 默认值
                    scaleValue.textContent = '1.5';
                }
                
                // 滑块值变化时更新显示
                scaleSlider.addEventListener('input', function() {
                    scaleValue.textContent = this.value;
                });
                
                // 保存缩放灵敏度设置
                saveScaleBtn.addEventListener('click', function() {
                    localStorage.setItem('scaleSensitivity', scaleSlider.value);
                    
                    // 显示保存成功消息
                    scaleMessage.style.display = 'block';
                    setTimeout(function() {
                        scaleMessage.style.display = 'none';
                    }, 2000);
                });
                
                // 加载旋转灵敏度设置
                const rotateSlider = document.getElementById('rotateSlider');
                const rotateValue = document.getElementById('rotateValue');
                const saveRotateBtn = document.getElementById('saveRotateBtn');
                const rotateMessage = document.getElementById('rotateMessage');
                
                // 默认旋转灵敏度为0.02，除非有保存的设置
                const savedRotateSensitivity = localStorage.getItem('rotateSensitivity');
                if (savedRotateSensitivity) {
                    rotateSlider.value = savedRotateSensitivity;
                    rotateValue.textContent = savedRotateSensitivity;
                } else {
                    rotateSlider.value = 0.02; // 默认值
                    rotateValue.textContent = '0.02';
                }
                
                // 滑块值变化时更新显示
                rotateSlider.addEventListener('input', function() {
                    rotateValue.textContent = this.value;
                });
                
                // 保存旋转灵敏度设置
                saveRotateBtn.addEventListener('click', function() {
                    localStorage.setItem('rotateSensitivity', rotateSlider.value);

                    // 显示保存成功消息
                    rotateMessage.style.display = 'block';
                    setTimeout(function() {
                        rotateMessage.style.display = 'none';
                    }, 2000);
                });

                // 加载鼠标拖拽灵敏度设置
                const mouseDragSlider = document.getElementById('mouseDragSlider');
                const mouseDragValue = document.getElementById('mouseDragValue');
                const saveMouseDragBtn = document.getElementById('saveMouseDragBtn');
                const mouseDragMessage = document.getElementById('mouseDragMessage');

                const savedMouseDragSensitivity = localStorage.getItem('mouseDragSensitivity');
                if (savedMouseDragSensitivity) {
                    mouseDragSlider.value = savedMouseDragSensitivity;
                    mouseDragValue.textContent = savedMouseDragSensitivity;
                } else {
                    mouseDragSlider.value = 1.0;
                    mouseDragValue.textContent = '1.0';
                }

                mouseDragSlider.addEventListener('input', function() {
                    mouseDragValue.textContent = this.value;
                });

                saveMouseDragBtn.addEventListener('click', function() {
                    localStorage.setItem('mouseDragSensitivity', mouseDragSlider.value);
                    mouseDragMessage.style.display = 'block';
                    setTimeout(function() {
                        mouseDragMessage.style.display = 'none';
                    }, 2000);
                });

                // 加载滚轮缩放灵敏度设置
                const mouseWheelSlider = document.getElementById('mouseWheelSlider');
                const mouseWheelValue = document.getElementById('mouseWheelValue');
                const saveMouseWheelBtn = document.getElementById('saveMouseWheelBtn');
                const mouseWheelMessage = document.getElementById('mouseWheelMessage');

                const savedMouseWheelSensitivity = localStorage.getItem('mouseWheelSensitivity');
                if (savedMouseWheelSensitivity) {
                    mouseWheelSlider.value = savedMouseWheelSensitivity;
                    mouseWheelValue.textContent = savedMouseWheelSensitivity;
                } else {
                    mouseWheelSlider.value = 10;
                    mouseWheelValue.textContent = '10';
                }

                mouseWheelSlider.addEventListener('input', function() {
                    mouseWheelValue.textContent = this.value;
                });

                saveMouseWheelBtn.addEventListener('click', function() {
                    localStorage.setItem('mouseWheelSensitivity', mouseWheelSlider.value);
                    mouseWheelMessage.style.display = 'block';
                    setTimeout(function() {
                        mouseWheelMessage.style.display = 'none';
                    }, 2000);
                });
            });
        </script>
        
        <script>
            // 导航按钮事件

            document.getElementById('galleryBtn')?.addEventListener('click', function() {
                window.location.href = 'gallery.html';
            });
            document.getElementById('settingsBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
            
            document.getElementById('tutorialBtn').addEventListener('click', function() {
                window.location.href = 'tutorial.html';
            });
        </script>
    
    <!-- 主题切换逻辑 -->
    <script>
        (function() {
            const THEME_KEY = 'themePreference';
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;

            function setTheme(mode) {
                if (mode === 'light') {
                    document.body.classList.add('light-mode');
                    btn.innerHTML = '☀️ 日间模式';
                    btn.title = '切换至夜间模式';
                } else {
                    document.body.classList.remove('light-mode');
                    btn.innerHTML = '🌙 夜间模式';
                    btn.title = '切换至日间模式';
                }
                localStorage.setItem(THEME_KEY, mode);
            }

            // 初始化：默认夜间模式
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'light') {
                setTheme('light');
            } else {
                setTheme('dark');
            }

            btn.addEventListener('click', function() {
                const current = localStorage.getItem(THEME_KEY);
                setTheme(current === 'light' ? 'dark' : 'light');
            });
        })();
    </script>

</body>
</html>
