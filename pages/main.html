<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D文物展示系统</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles/styles.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                "three/examples/": "https://unpkg.com/three@0.161.0/examples/jsm/",
                "three/loaders/": "https://unpkg.com/three@0.161.0/examples/jsm/loaders/"
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: '楷体', 'KaiTi', 'STKaiti', serif;
            background: black;
            overflow-x: hidden;
        }

        /* 主要布局 */
        .viewer-layout {
            display: flex;
            max-width: 1600px;
            margin: 120px auto 20px auto;
            gap: 20px;
            padding: 0 20px;
            height: calc(100vh - 140px);
        }

        /* 左侧边栏 - 相关介绍 */
        .left-sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .sidebar-title {
            color: #d4af37;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d4af37;
            font-family: '楷体', 'KaiTi', 'STKaiti', serif;
            letter-spacing: 2px;
        }

        .narrate-btn {
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #d4af37 0%, #b8960f 100%);
            color: #000;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .narrate-btn:hover {
            background: linear-gradient(135deg, #b8960f 0%, #d4af37 100%);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
        }

        .narrate-btn.speaking {
            background: #d4af37;
            border-color: #ffd700;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .model-description {
            font-size: 14px;
            line-height: 1.8;
            color: #cccccc;
        }

        .model-description h4 {
            margin: 15px 0 8px 0;
            color: #d4af37;
            font-size: 15px;
        }

        .model-description p {
            margin: 8px 0;
        }

        .model-meta {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* 语音控制按钮 */
        .voice-control-btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 2px 2px 0px #000;
            color: white;
        }

        .voice-control-btn.enabled {
            background: #28a745;
            border-color: #1e7e34;
        }

        .voice-control-btn.enabled:hover {
            background: #218838;
            transform: translateY(-1px);
            box-shadow: 3px 3px 0px #000;
        }

        .voice-control-btn.disabled {
            background: #6c757d;
            border-color: #545b62;
        }

        .voice-control-btn.disabled:hover {
            background: #5a6268;
            transform: translateY(-1px);
            box-shadow: 3px 3px 0px #000;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }

        .meta-label {
            color: #999;
        }

        .meta-value {
            color: #d4af37;
            font-weight: 500;
        }

        /* 中间3D展示区域 */
        .center-viewer {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        #renderDiv {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #renderDiv canvas {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: 100% !important;
        }

        #renderDiv video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: 100% !important;
            object-fit: contain !important;
            transform: translate(-50%, -50%) scaleX(-1) !important;
        }

        .camera-label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(212, 175, 55, 0.9);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10;
        }

        .model-switch-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            z-index: 10;
        }

        .model-switch-btn:hover {
            background: #d4af37;
            color: #000;
        }

        /* 右侧边栏 */
        .right-sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #d4af37;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            font-family: '楷体', 'KaiTi', 'STKaiti', serif;
            letter-spacing: 2px;
        }

        /* AI问答区域 */
        .ai-panel {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 400px;
            backdrop-filter: blur(10px);
        }

        .ai-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ai-speech-toggle {
            border: 1px solid #d4af37;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ai-speech-toggle.active {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.35);
        }

        .ai-speech-toggle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 语音选择弹窗 */
        .voice-selection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }

        .voice-selection-dialog {
            background: rgba(0, 0, 0, 0.95);
            border-radius: 12px;
            border: 2px solid #d4af37;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .voice-selection-dialog h3 {
            margin: 0 0 16px 0;
            color: #d4af37;
            font-size: 18px;
        }

        .voice-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
        }

        .voice-item {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .voice-item:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
        }

        .voice-item.selected {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
        }

        .voice-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .voice-name {
            font-size: 14px;
            font-weight: 600;
            color: #d4af37;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-lang {
            font-size: 12px;
            color: #999;
        }

        .quality-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .quality-badge.high {
            background: #4caf50;
            color: white;
        }

        .quality-badge.medium {
            background: #2196f3;
            color: white;
        }

        .quality-badge.low {
            background: #ff9800;
            color: white;
        }

        .voice-dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .voice-test-btn, .voice-close-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .voice-test-btn {
            background: #4a90e2;
            color: white;
        }

        .voice-test-btn:hover {
            background: #357abd;
        }

        .voice-close-btn {
            background: #e0e0e0;
            color: #555;
        }

        .voice-close-btn:hover {
            background: #d0d0d0;
        }

        .ai-chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            min-height: 0;
        }

        .ai-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-message {
            padding: 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message.user {
            background: #4a90e2;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message.user.speech-origin {
            border-left: 4px solid #f39c12;
            background: linear-gradient(120deg, #4a90e2 0%, #f9a825 120%);
        }

        .speech-origin-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #c05621;
            background: rgba(249, 168, 37, 0.15);
            padding: 2px 8px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        .ai-message.assistant {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #cccccc;
            align-self: flex-start;
        }

        .ai-message.system {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            align-self: center;
            font-size: 13px;
            text-align: center;
        }

        .ai-message.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #f5c6cb;
        }

        .message-content {
            font-size: 13px;
            line-height: 1.6;
        }

        .message-time {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .ai-input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            max-height: 150px;
            font-family: inherit;
            background: rgba(0, 0, 0, 0.5);
            color: #cccccc;
            transition: border-color 0.3s;
        }

        .ai-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .ai-submit-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #b8960f 100%);
            color: #000;
            border: 2px solid #d4af37;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .ai-submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #b8960f 0%, #d4af37 100%);
        }

        .ai-submit-btn:disabled {
            background: #555;
            border-color: #555;
            color: #999;
            cursor: not-allowed;
        }

        .btn-loading {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-loading::after {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 评论区域 */
        .comments-panel {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 350px;
            backdrop-filter: blur(10px);
        }

        .comment-input-area {
            margin-bottom: 15px;
        }

        .comment-input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            font-size: 13px;
            resize: none;
            font-family: inherit;
            background: rgba(0, 0, 0, 0.5);
            color: #cccccc;
        }

        .comment-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .comment-submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #b8960f 100%);
            color: #000;
            border: 2px solid #d4af37;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .comment-submit-btn:hover {
            background: linear-gradient(135deg, #b8960f 0%, #d4af37 100%);
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .comment-item {
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #d4af37;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .comment-author {
            font-weight: 600;
            color: #d4af37;
            font-size: 13px;
        }

        .comment-time {
            font-size: 12px;
            color: #888;
        }

        .comment-content {
            font-size: 13px;
            line-height: 1.6;
            color: #cccccc;
        }

        .no-comments {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 13px;
        }



        /* 模型选择卡片 */
        .model-selection-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: fadeIn 0.3s;
        }

        .model-selection-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border-radius: 12px;
            border: 2px solid #d4af37;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .model-selection-card h3 {
            margin: 0 0 20px 0;
            color: #d4af37;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 500;
            font-size: 14px;
        }

        .filter-btn {
            padding: 6px 15px;
            margin: 0 5px 5px 0;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #cccccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .filter-btn.active {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
        }

        .model-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .model-item {
            padding: 15px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            color: #cccccc;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .model-item:hover {
            border-color: #4a90e2;
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .model-item.selected {
            border-color: #4a90e2;
            background: #e3f2fd;
            font-weight: 600;
        }

        .close-btn {
            width: 100%;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #5a6268;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <!-- 顶部导航 -->
    <nav class="museum-nav">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-title">
                    <span class="title-icon">🏛️</span>
                    <span>3D数字文物展馆</span>
                </div>
            </div>
            <div class="nav-right">
                <button id="tutorialBtn" class="nav-btn">使用教程</button>
                <button id="settingsBtn" class="nav-btn">系统设置</button>
                <button id="homeBtn" class="nav-btn">返回首页</button>
                <button id="backBtn" class="nav-btn">返回上级</button>
            </div>
        </div>
    </nav>

    <!-- 主要布局 -->
    <div class="viewer-layout">
        <!-- 左侧边栏 - 相关介绍 -->
        <aside class="left-sidebar">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                <h3 class="sidebar-title" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">相关介绍</h3>
                <button id="narrateDescriptionBtn" class="narrate-btn" title="朗读文物介绍">
                    🔊 语音讲解
                </button>
            </div>
            <div class="model-description" id="modelDescription">
                <p>加载中...</p>
            </div>
        </aside>

        <!-- 中间3D展示区域 -->
        <main class="center-viewer">
            <div id="renderDiv">
                <!--<div class="camera-label">摄像头区域</div>-->
                <button class="model-switch-btn" id="selectModelBtn">切换文物</button>
            </div>
        </main>

        <!-- 右侧边栏 -->
        <aside class="right-sidebar">
            <!-- 语音控制按钮 -->
            <div style="margin-bottom: 12px; text-align: center;">
                <button id="voiceControlBtn" class="voice-control-btn" type="button" title="点击开启或关闭语音控制">
                    🎤 语音控制：已开启
                </button>
            </div>

            <!-- AI问答区域 -->
            <div class="ai-panel">
                <div class="ai-panel-header">

    <script type="module">
        // 简单的文物介绍朗读功能
        class DescriptionNarrator {
            constructor() {
                this.button = document.getElementById('narrateDescriptionBtn');
                this.descriptionElement = document.getElementById('modelDescription');
                this.isSpeaking = false;
                this.utterance = null;
                
                if (!('speechSynthesis' in window)) {
                    this.button.disabled = true;
                    this.button.textContent = '🔇 不支持';
                    this.button.title = '浏览器不支持语音合成';
                    return;
                }
                
                this.button.addEventListener('click', () => this.toggle());
                
                // 模型切换时停止朗读
                window.addEventListener('modelChanged', () => this.stop());
                window.addEventListener('beforeunload', () => this.stop());
            }
            
            toggle() {
                if (this.isSpeaking) {
                    this.stop();
                } else {
                    this.start();
                }
            }
            
            start() {
                const text = this.getText();
                if (!text) {
                    alert('暂无可朗读的内容');
                    return;
                }
                
                this.stop(); // 确保停止之前的朗读
                
                this.utterance = new SpeechSynthesisUtterance(text);
                this.utterance.lang = 'zh-CN';
                this.utterance.rate = 1.0;
                this.utterance.pitch = 1.0;
                
                // 选择中文语音
                const voices = speechSynthesis.getVoices();
                const chineseVoice = voices.find(v => v.lang.includes('zh'));
                if (chineseVoice) {
                    this.utterance.voice = chineseVoice;
                }
                
                this.utterance.onstart = () => {
                    this.isSpeaking = true;
                    this.button.textContent = '⏹ 停止讲解';
                    this.button.classList.add('speaking');
                };
                
                this.utterance.onend = () => {
                    this.isSpeaking = false;
                    this.button.textContent = '🔊 语音讲解';
                    this.button.classList.remove('speaking');
                };
                
                this.utterance.onerror = () => {
                    this.isSpeaking = false;
                    this.button.textContent = '🔊 语音讲解';
                    this.button.classList.remove('speaking');
                };
                
                speechSynthesis.speak(this.utterance);
            }
            
            stop() {
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                this.isSpeaking = false;
                this.button.textContent = '🔊 语音讲解';
                this.button.classList.remove('speaking');
            }
            
            getText() {
                if (!this.descriptionElement) return '';
                const text = this.descriptionElement.innerText || this.descriptionElement.textContent || '';
                const trimmed = text.trim();
                
                // 过滤占位文本
                if (trimmed === '加载中...' || trimmed === '未找到介绍' || trimmed.length < 10) {
                    return '';
                }
                
                return trimmed;
            }
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.descriptionNarrator = new DescriptionNarrator();
            });
        } else {
            window.descriptionNarrator = new DescriptionNarrator();
        }
    </script>

    <!-- 语音控制按钮逻辑 -->
    <script>
        (function() {
            const voiceControlBtn = document.getElementById('voiceControlBtn');
            if (!voiceControlBtn) return;

            function updateButtonState() {
                const enabled = localStorage.getItem('speechRecognitionEnabled') !== 'false';
                if (enabled) {
                    voiceControlBtn.className = 'voice-control-btn enabled';
                    voiceControlBtn.innerHTML = '🎤 语音控制：已开启';
                } else {
                    voiceControlBtn.className = 'voice-control-btn disabled';
                    voiceControlBtn.innerHTML = '🎤 语音控制：已关闭';
                }
            }

            // 初始化按钮状态
            updateButtonState();

            // 点击按钮切换语音控制
            voiceControlBtn.addEventListener('click', function() {
                const currentEnabled = localStorage.getItem('speechRecognitionEnabled') !== 'false';
                const newEnabled = !currentEnabled;
                localStorage.setItem('speechRecognitionEnabled', newEnabled ? 'true' : 'false');
                updateButtonState();
            });

            // 监听其他标签页对localStorage的修改（如game.js中的状态同步）
            window.addEventListener('storage', function(e) {
                if (e.key === 'speechRecognitionEnabled') {
                    updateButtonState();
                }
            });
        })();
    </script>

    <script type="module">
        // 确保渲染器在布局完成后正确调整大小

    <script type="module">
        // 获取当前URL参数中的模型路径
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get('model');
        let currentModelPath = modelParam || 'teacup.gltf';

        // 加载描述数据
        let descriptionsData = {};
        fetch('../data/descriptions.json')
            .then(res => res.json())
            .then(data => {
                descriptionsData = data;
                updateModelInfo(currentModelPath);
            })
            .catch(err => console.error('加载描述数据失败:', err));

        // 更新模型信息
        function updateModelInfo(modelPath) {
            const modelKey = getModelKey(modelPath);
            console.log(`📝 更新模型信息: 路径="${modelPath}" → 键名="${modelKey}"`);
            const modelData = descriptionsData[modelKey];

            if (modelData) {
                console.log(`✅ 找到描述数据:`, modelData.title);
                // 更新左侧介绍
                const descriptionDiv = document.getElementById('modelDescription');
                descriptionDiv.innerHTML = `
                    <h4>${modelData.title || '未知文物'}</h4>
                    ${modelData.dynasty ? `<div class="model-meta">
                        <div class="meta-item">
                            <span class="meta-label">朝代：</span>
                            <span class="meta-value">${modelData.dynasty}</span>
                        </div>
                    </div>` : ''}
                    ${modelData.year ? `<div class="meta-item">
                        <span class="meta-label">年代：</span>
                        <span class="meta-value">${modelData.year}</span>
                    </div>` : ''}
                    ${modelData.category ? `<div class="meta-item">
                        <span class="meta-label">类别：</span>
                        <span class="meta-value">${modelData.category}</span>
                    </div>` : ''}
                    <p style="margin-top: 15px; line-height: 1.8;">${modelData.description || '暂无描述信息'}</p>
                `;

                // 更新AI助手的模型数据
                if (window.aiAssistant) {
                    window.aiAssistant.setModelData(modelData);
                }
            } else {
                console.warn(`❌ 未找到键名"${modelKey}"的描述数据`);
                const descriptionDiv = document.getElementById('modelDescription');
                descriptionDiv.innerHTML = `
                    <h4>未找到介绍</h4>
                    <p style="margin-top: 15px; color: #999;">暂无该模型的描述信息</p>
                `;
            }
        }

        // 根据模型路径获取对应的key（智能提取）
        function getModelKey(path) {
            // 规范化路径
            const normalizedPath = path.replace(/^\.\.\//, '').replace(/^\.\//, '').replace(/^assets\//, '');
            const parts = normalizedPath.split('/');
            
            // 获取文件名
            const fileName = parts[parts.length - 1];
            const fileNameWithoutExt = fileName.split('.')[0];
            
            // 如果文件名是 scene，使用父文件夹名
            if (fileNameWithoutExt === 'scene' && parts.length > 1) {
                const key = parts[parts.length - 2];
                console.log(`🔑 提取模型键名: "${path}" → scene文件 → 使用父文件夹 "${key}"`);
                return key;
            }
            
            // 否则返回文件名（不含扩展名）
            console.log(`🔑 提取模型键名: "${path}" → 使用文件名 "${fileNameWithoutExt}"`);
            return fileNameWithoutExt;
        }

        // 模型选择功能
        const selectModelBtn = document.getElementById('selectModelBtn');
        const modelSelectionOverlay = document.getElementById('modelSelectionOverlay');
        const closeModelCard = document.getElementById('closeModelCard');
        const modelItems = document.querySelectorAll('.model-item');

        selectModelBtn.addEventListener('click', () => {
            modelSelectionOverlay.style.display = 'block';
        });

        closeModelCard.addEventListener('click', () => {
            modelSelectionOverlay.style.display = 'none';
        });

        modelSelectionOverlay.addEventListener('click', (e) => {
            if (e.target === modelSelectionOverlay) {
                modelSelectionOverlay.style.display = 'none';
            }
        });

        modelItems.forEach(item => {
            item.addEventListener('click', function() {
                const modelPath = this.getAttribute('data-model');
                
                // 触发模型加载事件
                const event = new CustomEvent('loadNewModel', { 
                    detail: { modelPath: '../assets/' + modelPath }
                });
                window.dispatchEvent(event);
                
                // 更新选中状态
                modelItems.forEach(m => m.classList.remove('selected'));
                this.classList.add('selected');
                
                // 更新模型信息
                currentModelPath = modelPath;
                updateModelInfo(modelPath);
                
                // 关闭弹窗
                modelSelectionOverlay.style.display = 'none';
            });
        });

        // 过滤功能
        const filterBtns = document.querySelectorAll('.filter-btn');
        let currentDynastyFilter = 'all';
        let currentCategoryFilter = 'all';

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.getAttribute('data-filter-type');
                const filterValue = this.getAttribute('data-filter-value');
                
                if (filterType === 'dynasty') {
                    currentDynastyFilter = filterValue;
                    document.querySelectorAll('.filter-btn[data-filter-type="dynasty"]').forEach(b => {
                        b.classList.remove('active');
                    });
                } else if (filterType === 'category') {
                    currentCategoryFilter = filterValue;
                    document.querySelectorAll('.filter-btn[data-filter-type="category"]').forEach(b => {
                        b.classList.remove('active');
                    });
                }
                
                this.classList.add('active');
                applyFilters();
            });
        });

        function applyFilters() {
            modelItems.forEach(item => {
                const itemDynasty = item.getAttribute('data-dynasty');
                const itemCategory = item.getAttribute('data-category');
                
                const dynastyMatch = currentDynastyFilter === 'all' || itemDynasty === currentDynastyFilter;
                const categoryMatch = currentCategoryFilter === 'all' || itemCategory === currentCategoryFilter;
                
                item.style.display = (dynastyMatch && categoryMatch) ? 'block' : 'none';
            });
        }

        // 监听模型变更事件
        window.addEventListener('modelChanged', (e) => {
            const modelPath = e.detail.modelPath;
            if (modelPath) {
                currentModelPath = modelPath.replace('../assets/', '');
                updateModelInfo(currentModelPath);
                
                // 通知评论系统更新
                if (window.commentManager) {
                    console.log('通知评论系统更新模型路径:', modelPath);
                    window.commentManager.setCurrentModelPath(modelPath);
                }
            }
        });

        // 导航按钮功能
        document.getElementById('tutorialBtn')?.addEventListener('click', () => {
            window.location.href = 'tutorial.html';
        });
        
        document.getElementById('settingsBtn')?.addEventListener('click', () => {
            window.location.href = 'settings.html';
        });
        
        document.getElementById('homeBtn')?.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        
        document.getElementById('backBtn')?.addEventListener('click', () => {
            window.location.href = 'dynasty.html';
        });
    </script>
